# ─────────────────────────────────────────────────────────────
# StockSense — Render Blueprint (backend + Postgres)
# ─────────────────────────────────────────────────────────────
# Deploy with: Render Dashboard → New → Blueprint → point at this repo.
# This provisions the FastAPI backend (Docker) + a free Postgres DB.
# The React frontend deploys separately on Vercel (see DEPLOYMENT.md).
# ─────────────────────────────────────────────────────────────

services:
  - type: web
    name: stocksense-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Strong JWT secret — generated by Render, never commit a real one
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      # Wired automatically from the database defined below
      - key: DATABASE_URL
        fromDatabase:
          name: stocksense-db
          property: connectionString
      # Set these in the Render dashboard after the first deploy:
      #   CORS_ORIGINS = https://<your-frontend>.vercel.app
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        sync: false
      # AI providers (optional — set whichever you use)
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false

databases:
  - name: stocksense-db
    plan: free
